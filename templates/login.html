<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BuscaYa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #e8f5e9;">

    <div class="card shadow-lg p-4 rounded-4 border-0" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-success">🔍 BuscaYa</h2>
            <p class="text-muted">Sistema de Objetos Perdidos</p>
        </div>

        <!-- SECCIÓN DE ALERTAS FLASH (Añadido para mostrar los errores en pantalla) -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger text-center p-2 small mb-3" role="alert">
              {% for message in messages %}
                <strong>{{ message }}</strong>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label font-weight-bold">Correo Institucional</label>
                <!-- CORREGIDO: Se cambió name="text" por name="email" para que Python pueda leerlo -->
                <input type="text" name="email" class="form-control form-control-lg border-success-subtle" placeholder="ejemplo@uni.edu" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control form-control-lg border-success-subtle" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm mb-3">Ingresar</button>
        </form>

        <div class="text-center border-top pt-3">
            <small class="text-muted">¿Aún no tienes cuenta? <a href="/registro" class="text-success text-decoration-none fw-bold">Regístrate aquí</a></small>
        </div>
    </div>

</body>
</html>
