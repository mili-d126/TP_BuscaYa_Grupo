<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - BuscaYa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #e8f5e9;">

    <div class="card shadow-lg p-4 rounded-4 border-0" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-success">Crear una Cuenta</h3>
            <p class="text-muted small">Únete a la comunidad universitaria</p>
        </div>


        {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-danger text-center p-2 small mb-3" role="alert">
          {% for message in messages %}
            <strong>{{ message }}</strong>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/registro" method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
        <input type="text" name="nombre" class="form-control border-success-subtle" placeholder="Juan Pérez" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Correo Institucional</label>
        <!-- CORREGIDO AQUÍ: Se cambió name="text" por name="email" -->
        <input type="text" name="email" class="form-control border-success-subtle" placeholder="juan@uni.edu" required>
    </div>

    <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" name="contrasena" class="form-control border-success-subtle" placeholder="Mínimo 6 caracteres" required>
    </div>

    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm mb-3">Registrarse</button>
</form>

        <div class="text-center border-top pt-3">
            <small class="text-muted">¿Ya tienes cuenta? <a href="/login" class="text-success text-decoration-none fw-bold">Inicia sesión</a></small>
        </div>
    </div>

</body>
</html>
