<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - BuscaYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>#mapa { height: 68vh; min-height: 380px; border-radius: 1rem; }</style>
</head>
<body style="background-color: #f1f8e9;">
    {% include '_navbar.html' %}

    <div class="container mb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} text-center p-2 small mb-3" role="alert">
              <strong>{{ message }}</strong>
            </div>
          {% endfor %}
        {% endwith %}

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-12 col-md">
                        <h5 class="fw-bold text-success mb-0">Mapa de objetos</h5>
                        <small class="text-muted" id="contador">Cargando reportes…</small>
                    </div>
                    <div class="col-6 col-md-3">
                        <select id="filtroTipo" class="form-select border-success-subtle">
                            <option value="">Perdidos y encontrados</option>
                            <option value="perdido">Solo perdidos</option>
                            <option value="encontrado">Solo encontrados</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <select id="filtroCategoria" class="form-select border-success-subtle">
                            <option value="">Todas las categorías</option>
                            {% for c in categorias %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                        </select>
                    </div>
                </div>

                <div id="mapa"></div>

                <div class="d-flex gap-3 mt-3 small text-muted">
                    <span><span class="badge bg-danger">&nbsp;</span> Perdido</span>
                    <span><span class="badge bg-success">&nbsp;</span> Encontrado</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CENTRO_INICIAL = [-25.2637, -57.5759]; // Asunción. Cámbialo por tu universidad.
        const mapa = L.map('mapa').setView(CENTRO_INICIAL, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(mapa);

        const capa = L.layerGroup().addTo(mapa);
        const COLORES = { perdido: '#dc3545', encontrado: '#198754' };

        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t ?? '';
            return d.innerHTML;
        }

        async function cargar() {
            const params = new URLSearchParams({
                tipo: document.getElementById('filtroTipo').value,
                categoria: document.getElementById('filtroCategoria').value
            });
            const resp = await fetch('/api/reportes?' + params);
            const datos = await resp.json();

            capa.clearLayers();
            datos.forEach(r => {
                const marcador = L.circleMarker([r.latitud, r.longitud], {
                    radius: 10, color: '#fff', weight: 2,
                    fillColor: COLORES[r.tipo], fillOpacity: 0.95
                });
                marcador.bindPopup(
                    `<strong>${esc(r.titulo)}</strong><br>
                     <span class="badge" style="background:${COLORES[r.tipo]}">${r.tipo === 'perdido' ? 'Perdido' : 'Encontrado'}</span><br>
                     <small>${esc(r.lugar)} · ${esc(r.fecha)}</small><br>
                     <a href="/reportes/${r.id}">Ver detalle</a>`
                );
                marcador.addTo(capa);
            });

            document.getElementById('contador').textContent =
                datos.length === 1 ? '1 reporte activo' : datos.length + ' reportes activos';

            if (datos.length) {
                mapa.fitBounds(L.latLngBounds(datos.map(r => [r.latitud, r.longitud])), { padding: [40, 40], maxZoom: 16 });
            }
        }

        document.getElementById('filtroTipo').addEventListener('change', cargar);
        document.getElementById('filtroCategoria').addEventListener('change', cargar);
        cargar();
    </script>
</body>
</html>
